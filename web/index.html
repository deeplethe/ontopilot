<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Marcellus&display=swap"
    />
    <title>Utopia</title>
    <!-- 首帧前定主题：与 src/theme.ts 同一套解法。放在 head 里、样式之前，
         刷新时才不会先闪一下暗底再变浅 -->
    <script>
      (function () {
        var t = "dark";
        try { t = localStorage.getItem("utopia.theme") || "dark"; } catch (e) {}
        if (t === "system")
          t = window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        document.documentElement.dataset.theme = t === "light" ? "light" : "dark";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
